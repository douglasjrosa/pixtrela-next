# Production Postgres on the Pixtrela VPS.
# Laptop development uses docker-compose.yml (local Docker).
# Usage:
#   cp env.db.example .env.db
#   docker compose -f docker-compose.db.yml --env-file .env.db up -d

services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: pixtrela-postgres-prod
    restart: unless-stopped
    ports:
      # App cutover: bind loopback only (see docs/VPS-POSTGRES.md).
      - "${PROD_PG_HOST_BIND:-127.0.0.1}:${PROD_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PROD_PG_USER:?set PROD_PG_USER in .env.db}
      POSTGRES_PASSWORD: ${PROD_PG_PASSWORD:?set PROD_PG_PASSWORD in .env.db}
      POSTGRES_DB: ${PROD_PG_DB:-pixtrela}
    volumes:
      - pixtrela_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pixtrela_pg_prod:
