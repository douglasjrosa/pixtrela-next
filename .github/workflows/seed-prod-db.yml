name: Seed prod DB (Ribermax presets)

on:
  workflow_dispatch:

jobs:
  seed:
    name: seed rbx presets (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Seed Ribermax subtask presets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: npm run db:seed:rbx-presets
