name: Deploy prod DB

# Runs Drizzle migrations against VPS postgres-prod after push to master.
# App deploy is handled by Vercel GitHub integration.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  migrate:
    name: drizzle migrate (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match local/Vercel Node; npm ci fails when lock lags peer resolves.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Migrate production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: npm run db:migrate
