name: Deploy prod DB

# Schema migrations run on the VPS during Deploy VPS
# (.github/workflows/deploy-vps.yml). This workflow stays as a no-op so
# older branch protection still sees a green check.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  migrate:
    name: drizzle migrate (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip remote migrate
        run: echo "Prod schema is applied on the VPS by deploy-app-vps.sh."
