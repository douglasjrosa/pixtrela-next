name: Deploy prod DB

# Migrations now run on the VPS during scripts/deploy-app-vps.sh, on the
# Docker network. This workflow stays as a no-op so older branch protection
# still sees a green check.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  migrate:
    name: drizzle migrate (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip remote migrate
        run: echo "Prod schema is applied on the VPS by deploy-app-vps.sh."
