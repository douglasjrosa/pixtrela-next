# Long read timeout keeps SSE connections open between heartbeats.
# Placeholder __SSE_PROXY_READ_TIMEOUT__ is replaced at deploy time.
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout __SSE_PROXY_READ_TIMEOUT__;
    proxy_send_timeout __SSE_PROXY_READ_TIMEOUT__;
    add_header X-Accel-Buffering no;
}
